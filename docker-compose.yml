services:
  dcc-crawler-sheets:
    image: ghcr.io/alorkas/dcc-crawler-sheets:latest
    restart: unless-stopped
    ports:
      - '${DCC_PORT:-8080}:3000'
    environment:
      - NODE_ENV=production
      # values come from the .env file next to this compose file (see .env.example)
      - ADMIN_USERNAME=${DCC_ADMIN_USERNAME:?set DCC_ADMIN_USERNAME in .env}
      - ADMIN_PASSWORD=${DCC_ADMIN_PASSWORD:?set DCC_ADMIN_PASSWORD in .env}
      - JWT_SECRET=${DCC_JWT_SECRET:-}
      - ALLOW_REGISTRATION=${DCC_ALLOW_REGISTRATION:-true}
      # true when served over HTTPS (e.g. behind a reverse proxy with TLS)
      - COOKIE_SECURE=${DCC_COOKIE_SECURE:-false}
    volumes:
      - crawler-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  crawler-data:
